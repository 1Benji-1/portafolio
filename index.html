<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Photo.jpg" />

  <!-- Preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
  </noscript>

  <!-- Main SEO -->
  <title>Yoel Bulacia | Backend Developer</title>
  <meta
    name="description"
    content="Official website of Yoel Bulacia, Backend Developer focused on building scalable systems, automation, and efficient architectures. I strive to deliver reliable and high-performance solutions in every project."
  />
  <meta
    name="keywords"
    content="Yoel Bulacia, Backend Developer, DevOps, Automation, Systems, APIs, Microservices, Python, Node.js, PostgreSQL, Docker, Portfolio"
  />
  <meta name="author" content="Yoel Bulacia" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://comrad.vercel.app/" />
  <meta property="og:title" content="Yoel Bulacia | Backend Developer" />
  <meta
    property="og:description"
    content="Official website and portfolio of Yoel Bulacia, Backend Developer focused on systems, automation, and scalable architectures."
  />
  <meta property="og:image" content="https://comrad.vercel.app/Meta.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://comrad.vercel.app/" />
  <meta name="twitter:title" content="Yoel Bulacia | Backend Developer" />
  <meta
    name="twitter:description"
    content="Official website and portfolio of Yoel Bulacia, Backend Developer focused on systems, automation, and scalable architectures."
  />
  <meta name="twitter:image" content="https://comrad.vercel.app/Meta.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://comrad.vercel.app/" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Yoel Bulacia",
    "url": "https://comrad.vercel.app",
    "image": "https://comrad.vercel.app/Photo.jpg",

    "description": "I focus on building scalable systems and automation, always striving to deliver efficient, reliable, and high-performance solutions in every project I work on.",

      "https://www.linkedin.com/in/bulacia_yoel/",
      "https://www.instagram.com/bulacia_yoel/?hl=id",
      "https://github.com/bulacia-yoel",
      "https://www.tiktok.com/@bulacia_yoel"
    ]
  }
  </script>
</head>

<body>
